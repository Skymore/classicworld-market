<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>枫叶市场 · 本地观察站</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e7edf6;background:#0c1320}*{box-sizing:border-box}body{margin:0}header{padding:36px 5vw 24px;background:linear-gradient(110deg,#162a36,#152038)}h1{margin:8px 0;font-size:30px}small,.muted{color:#9eafc5}.brand{color:#7fe4bb;letter-spacing:3px;font-size:12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}main{max-width:1450px;margin:auto;padding:24px 4vw}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#172337;border:1px solid #283750;border-radius:12px;padding:18px}.card b{display:block;font-size:28px;margin-top:8px}.notice{padding:14px 18px;background:#29271e;border:1px solid #625333;border-radius:10px;color:#efcf8c;font-size:13px;line-height:1.8}button,input,select{font:inherit;color:inherit;border:1px solid #344760;background:#172337;padding:10px 14px;border-radius:8px}button{cursor:pointer}button.on{color:#10251e;background:#7fe4bb;border-color:#7fe4bb}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}input{min-width:260px;flex:1}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#9cafc8;font-weight:500;background:#172337;white-space:nowrap}td,th{padding:14px 12px;border-bottom:1px solid #253247}tbody tr:hover{background:#18273b}td small{display:block;margin-top:4px}.table{overflow:auto;border:1px solid #283750;border-radius:10px}a{color:#7fe4bb}.pill{font-size:11px;padding:3px 7px;border-radius:5px;background:#303128;color:#eed18d}.empty{text-align:center;color:#9eafc5;padding:45px}dialog{background:#152235;color:#e7edf6;border:1px solid #445875;border-radius:12px;width:min(1000px,95vw)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:60vh;overflow:auto}footer{margin:24px 0;color:#8b9ab2;font-size:12px;line-height:1.8}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style>
<header><div class="bar"><div><div class="brand">MAPLE MARKET / LOCAL OBSERVATORY</div><h1>枫叶市场观察站</h1><small>手动逛摊 · 原始记录留存 · 分类价格统计</small></div><div id="status">正在连接本地服务…</div></div></header>
<main><div class="notice">摆摊价为最近 24 小时、每个摊位最新快照的单位报价。<b>售光推定成交</b>按库存为零记录，使用前次摆摊价；成交数量、实际成交时间未知。当前价格／库存字段待画面核对，装备属性未完整解析，不能仅凭同名装备比较价格。</div>
<div class="cards"><div class="card">已观察物品<b id="items">—</b></div><div class="card">已观察摊位 / 近24h<b id="shops">—</b></div><div class="card">手动访问 / 商品观察记录<b id="visits">—</b></div><div class="card">售光推定事件<b id="sales">—</b></div></div>
<div class="controls" id="tabs"><button class="on" data-view="items">分类报价</button><button data-view="sales">售光推定成交</button><button data-view="history">原始观察历史</button><button id="export">导出完整 JSON</button></div>
<div class="controls"><input id="search" placeholder="搜索中文名、英文名、物品 ID 或摊位"><select id="category"><option>全部分类</option><option>装备</option><option>消耗品</option><option>装饰</option><option>其他</option><option>商城物品</option></select><select id="sort"><option value="recent">最近观察</option><option value="price">价格从低到高</option><option value="name">按名称</option></select></div>
<div class="bar"><p class="muted" id="summary"></p><small>每 5 秒刷新 · 只读本地 API</small></div><div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><footer id="foot"></footer></main>
<dialog id="detail"><div class="bar"><h3>观察详情与数据来源</h3><button id="close">关闭</button></div><pre id="json"></pre></dialog>
<script>
let data=null,view='items',visible=[];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>x==null?'—':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2}),date=x=>new Date(x*1000).toLocaleString('zh-CN');
function render(){if(!data)return;let q=$('search').value.toLowerCase(),cat=$('category').value;visible=data[view].filter(r=>(cat==='全部分类'||r.category===cat)&&[r.name_zh,r.name_en,r.item_id,r.shop].join(' ').toLowerCase().includes(q));visible.sort((a,b)=>$('sort').value==='price'?((a.low??a.sale_unit_price??a.unit_price??Infinity)-(b.low??b.sale_unit_price??b.unit_price??Infinity)):$('sort').value==='name'?a.name_zh.localeCompare(b.name_zh,'zh-CN'):(b.last_seen??b.time)-(a.last_seen??a.time));
let labels=view==='items'?['商品 / 分类','最低单位报价','中位 / 最高','摊位 / 挂单','售光推定中位价','最近观察','详情']:view==='sales'?['商品 / 分类','推定单位成交价','摊位','依据','发现售光时间','详情']:['商品 / 分类','单位报价 / 整组价','库存 / 每组数量','摊位','观察时间','来源','详情'];$('head').innerHTML='<tr>'+labels.map(s=>'<th>'+s+'</th>').join('')+'</tr>';
$('body').innerHTML=visible.slice(0,1000).map((r,i)=>{let name=`<b>${esc(r.name_zh)}</b><small>${esc(r.name_en)} · ${r.item_id} · ${esc(r.category)}</small>${r.category==='装备'?'<small>属性分组 '+esc(r.variant)+'</small>':''}`;let cells=view==='items'?[name,num(r.low),num(r.median)+' / '+num(r.high),r.shops+' / '+r.listings,num(r.sold_out_median),date(r.last_seen)]:view==='sales'?[name,num(r.sale_unit_price),esc(r.shop),'库存为零；成交数量未知',date(r.time)]:[name,num(r.unit_price)+' / '+num(r.price),num(r.stock)+' / '+num(r.bundle),esc(r.shop),date(r.time),r.experimental?'旧主动测试（不参与统计）':r.raw_available?'手动 · 有原始正文':'手动 · 旧数据无原始正文'];return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+`<td><button data-index="${i}">查看</button></td></tr>`}).join('')||`<tr><td class="empty" colspan="7">暂无匹配记录。手动打开摊位后，成功解析的商品会出现在这里。</td></tr>`;$('summary').textContent=`${visible.length} 条结果${visible.length>1000?'（当前显示前 1000 条，完整数据可导出）':''}`;
$('items').textContent=num(data.item_count);$('shops').textContent=data.observed_shops+' / '+data.active_shops;$('visits').textContent=data.manual_visits+' / '+data.manual_observations;$('sales').textContent=data.sales.length;
let c=data.capture;$('status').textContent=data.connection_health?.message||'正在检测游戏连接…';$('status').style.color=data.connection_health?.state==='ready'?'#7fe4bb':'#efcf8c';$('foot').textContent=`更新：${date(data.generated_at)}。${data.limitation} 旧主动测试访问 ${data.experimental_visits} 次，保留历史但排除聚合。${data.health?.errors.length?' 数据处理错误：'+JSON.stringify(data.health.errors):''}`;}
async function load(){try{let r=await fetch('/api/v1/market');if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){$('status').textContent='本地服务未连接，请运行 start_market_mvp.ps1'}}
$('tabs').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));render()}};$('body').onclick=e=>{let i=e.target.dataset.index;if(i!==undefined){$('json').textContent=JSON.stringify(visible[i],null,2);$('detail').showModal()}};$('close').onclick=()=>$('detail').close();['search','category','sort'].forEach(id=>$(id).oninput=render);$('export').onclick=()=>{if(!data)return;let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='market-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};load();setInterval(load,5000);
</script></html>
