<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>枫叶市集 · 成员登录</title><link rel="stylesheet" href="/market_ui.css"><style>body{background:#f3f5ef;color:#203d32;font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;padding:40px;border-radius:18px;max-width:380px;margin:20px;box-shadow:0 8px 40px #203d3212}input,button{box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:1px solid #c7d4ca;border-radius:8px}button{background:#256e51;color:white;cursor:pointer}p{line-height:1.7}#status{color:#a34530}</style><main><h1>枫叶市集</h1><p>和朋友一起记录市场价格。输入管理员发给你的独立访问码，查看共同采集的报价。</p><form><label for="token">成员访问码</label><input id="token" type="password" autocomplete="off" required maxlength="128"><button>进入市集</button><p id="status" role="status"></p></form><small>访问码不要发到群聊或公开仓库。</small></main><script src="/market_i18n.js"></script><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/v1/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});if(r.ok)location.replace('/');else document.querySelector('#status').textContent=MarketI18n.t('访问码无效或请求过多，请检查后重试。')}</script></html>
