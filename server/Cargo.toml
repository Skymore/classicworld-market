[workspace]
resolver = "2"
members = ["crates/market-core", "crates/market-reader-wasm", "crates/market-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
