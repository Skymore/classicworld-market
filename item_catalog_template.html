<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic World 中文物品图鉴</title>
<style>
body{margin:0;background:#f4f1e9;color:#23342c;font:15px system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{padding-bottom:12px}h1{font-size:30px;margin:6px 0}p{line-height:1.7}.sub{color:#64746b;font-size:13px}nav{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#f4f1e9;padding:12px 0;z-index:1}input,select,button{font:inherit;padding:10px;border:1px solid #ccd5cd;border-radius:7px;background:white;color:inherit}input{flex:1;min-width:200px}button{cursor:pointer}button:disabled{opacity:.4}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.card{text-align:left;display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:16px;min-height:110px}.card:hover{border-color:#387b5e}.card img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}.name{font-weight:650;display:block}.en{display:block;font-size:12px;color:#657468;margin-top:4px}.meta{display:block;font-size:12px;margin-top:8px}.translated{color:#9a5b19}footer{display:flex;gap:16px;align-items:center;justify-content:center;padding:24px}dialog{border:1px solid #ccd5cd;border-radius:14px;max-width:660px;width:85%;padding:28px;color:inherit}dialog::backdrop{background:#14271c88}pre{white-space:pre-wrap;line-height:1.7;font:14px system-ui;overflow-wrap:anywhere}a{color:#236c49}#detailClose{float:right}#count{margin:8px 0 16px}
</style>
<header><div class="sub">MAPLESTORY CLASSIC WORLD · 2026-10-10 数据快照</div><h1>中文物品图鉴</h1><p>按物品 ID、中英文名称或类别查找。属性为公开资料中的基础值，市场装备的随机属性和砸卷结果须另行采集。</p><div class="sub">来源：DVG 国际怀旧服全量图鉴、Mapledex CoT2 字典。参考译名已标注；收录不代表当前可获得。图标在线加载，文字可离线查询。</div></header>
<main><nav><input id="search" placeholder="搜索名称或物品 ID" aria-label="搜索名称或物品 ID"><select id="category" aria-label="类别"><option value="">全部类别</option></select><select id="status" aria-label="中文名称来源"><option value="">全部名称来源</option><option value="database_chinese">数据库中文名</option><option value="assistant_translation">参考译名</option></select></nav><div id="count" class="sub"></div><div id="grid"></div><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer></main>
<dialog id="detail"><button id="detailClose">关闭</button><h2 id="title"></h2><p id="english"></p><pre id="facts"></pre><a id="source" target="_blank" rel="noopener">查看原始资料</a></dialog>
<script src="catalog-data.js"></script>
<script>
const items=window.CATALOG_ITEMS;let page=0;const size=60;
const $=id=>document.getElementById(id);let filtered=items;
for(const c of [...new Set(items.map(x=>x.category).filter(Boolean))].sort()){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}
function details(r){$('title').textContent=r.name_zh||r.name_en;$('english').textContent=`${r.name_en||''} · ID ${r.item_id}`;const stats=(r.base_stats||[]).map(s=>`${s.label||s.key}：${s.value}`).join('\n');$('facts').textContent=`类别：${r.category||'未注明'}\n中文名称：${r.name_status==='assistant_translation'?'参考译名（非官方）':'数据库中文名'}\n来源版本：${r.source_version}\n等级要求：${r.level??'未注明'}\nNPC价格：${r.npc_price??'未注明'}（非玩家市场价）\n\n基础属性（来源列出的字段）：\n${stats||'未提供数值属性'}\n\n说明（来源原文，可能存在版本差异）：\n${r.description_zh||'未提供'}`;$('source').href=r.name_source||'https://mxdgcw.dvg.cn/';$('detail').showModal()}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('count').textContent=`共 ${items.length.toLocaleString()} 条 · 匹配 ${filtered.length.toLocaleString()} 条`;$('grid').replaceChildren();for(const r of filtered.slice(page*size,(page+1)*size)){const b=document.createElement('button');b.className='card';const img=document.createElement('img');img.alt='';img.loading='lazy';if(r.icon_url)img.src=r.icon_url;img.onerror=()=>{img.style.visibility='hidden'};const text=document.createElement('span');for(const [cls,value] of [['name',r.name_zh||r.name_en],['en',r.name_en||''],['meta',`${r.item_id} · ${r.category||'未分类'}${r.name_status==='assistant_translation'?' · 参考译名':''}`]]){const s=document.createElement('span');s.className=cls+(cls==='meta'&&r.name_status==='assistant_translation'?' translated':'');s.textContent=value;text.append(s)}b.append(img,text);b.onclick=()=>details(r);$('grid').append(b)}$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
function filter(){const q=$('search').value.trim().toLowerCase(),c=$('category').value,s=$('status').value;filtered=items.filter(r=>(!c||r.category===c)&&(!s||r.name_status===s)&&(!q||`${r.item_id} ${r.name_zh} ${r.name_en} ${r.category}`.toLowerCase().includes(q)));page=0;render()}
$('search').oninput=filter;$('category').onchange=filter;$('status').onchange=filter;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('detailClose').onclick=()=>$('detail').close();render();
</script></html>
